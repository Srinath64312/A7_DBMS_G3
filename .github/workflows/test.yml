name: Backend Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Admin@123
          POSTGRES_DB: klhdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DATABASE: klhdb
          PG_USER: postgres
          PG_PASSWORD: Admin@123
          DATABASE_URL: postgresql://postgres:Admin%40123@localhost:5432/klhdb
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB_NAME: distributed_commerce_db
          REDIS_URI: redis://localhost:6379/0
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py"

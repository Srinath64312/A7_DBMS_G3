global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api_gateway'
    static_configs:
      - targets: ['gateway:5000']

  - job_name: 'identity_service'
    static_configs:
      - targets: ['identity_service:8001']

  - job_name: 'catalog_service'
    static_configs:
      - targets: ['catalog_service:8002']

  - job_name: 'inventory_service'
    static_configs:
      - targets: ['inventory_service:8003']

  - job_name: 'order_service'
    static_configs:
      - targets: ['order_service:8004']
